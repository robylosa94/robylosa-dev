<!doctype html>
<!--
  Social preview images (1200×630) in the site's style.
  Rendered to PNG by og/build.sh: ?page=home|playground&lang=en|it.
  Texts mirror src/data/site.ts and src/data/playground.ts; re-run the script when they change.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: 'Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
      }
      :root {
        --paper: #f2f3ee;
        --ink: #0f1a14;
        --muted: #56625a;
        --accent: #12894f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Plex Mono', monospace;
        font-weight: 500;
        padding: 56px 64px 52px;
        display: flex;
        flex-direction: column;
      }
      /* The hero's dot grid, with the green spotlight parked top-right. */
      body::before,
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background-size: 22px 22px;
        background-position: 11px 11px;
      }
      body::before {
        background-image: radial-gradient(color-mix(in srgb, var(--ink) 15%, transparent) 1.2px, transparent 1.6px);
      }
      body::after {
        background-image: radial-gradient(var(--accent) 1.9px, transparent 2.3px);
        mask-image: radial-gradient(340px circle at 960px 230px, #000 0%, transparent 75%);
      }
      body > * {
        position: relative;
        z-index: 1;
      }
      .kicker {
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 28px;
      }
      .kicker::before {
        content: '●';
        color: var(--accent);
        margin-right: 14px;
      }
      .name {
        margin: auto 0 0 -6px;
        font: 900 236px / 0.8 'Archivo', sans-serif;
        font-stretch: 62%;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .name span {
        display: block;
      }
      .name .accent {
        color: var(--accent);
      }
      .foot {
        margin-top: 34px;
        padding-top: 22px;
        border-top: 3px solid var(--ink);
        display: flex;
        justify-content: space-between;
        font-size: 26px;
      }
      .foot .url {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <p class="kicker" id="kicker"></p>
    <h1 class="name" id="name"></h1>
    <p class="foot"><span id="line"></span><span class="url" id="url"></span></p>

    <script>
      const q = new URLSearchParams(location.search);
      const page = q.get('page') === 'playground' ? 'playground' : 'home';
      const lang = q.get('lang') === 'it' ? 'it' : 'en';

      const texts = {
        home: {
          en: { kicker: 'Frontend engineer · Lecco, Italy · since 2013', name: ['Roberto', 'Losa'], line: 'Software Engineer, Frontend @ iliad', url: 'robylosa.dev' },
          it: { kicker: 'Frontend engineer · Lecco, Italia · dal 2013', name: ['Roberto', 'Losa'], line: 'Software Engineer, Frontend @ iliad', url: 'robylosa.dev/it' },
        },
        playground: {
          en: { kicker: 'Roberto Losa · Interface experiments', name: ['Play', 'ground'], line: 'Animations, sliders, menus, scroll effects', url: 'robylosa.dev/playground' },
          it: { kicker: 'Roberto Losa · Esperimenti di interfaccia', name: ['Play', 'ground'], line: 'Animazioni, slider, menu, effetti scroll', url: 'robylosa.dev/playground' },
        },
      };
      const t = texts[page][lang];

      document.documentElement.lang = lang;
      document.getElementById('kicker').textContent = t.kicker;
      document.getElementById('line').textContent = t.line;
      document.getElementById('url').textContent = t.url;
      const name = document.getElementById('name');
      t.name.forEach((word, i) => {
        const s = document.createElement('span');
        s.textContent = word;
        if (i === 1) s.className = 'accent';
        name.append(s);
      });
    </script>
  </body>
</html>
