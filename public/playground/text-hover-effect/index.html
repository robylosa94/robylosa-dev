<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roberto Losa - Text Hover Effect</title>
    <link rel="canonical" href="https://www.robylosa.dev/playground/text-hover-effect/" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../apple-touch-icon.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../favicon-32x32.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../favicon-16x16.png?v=1"
    />
    <link rel="manifest" href="../site.webmanifest.json?v=1" />
    <link rel="mask-icon" href="../safari-pinned-tab.svg?v=1" color="#000000" />
    <link rel="shortcut icon" href="../favicon.ico?v=1" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="../topbar.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar" data-topbar>
      <div class="topbar__crumbs" role="navigation" aria-label="Breadcrumb">
        <a href="/">Roberto Losa</a>
        <span class="topbar__sep" aria-hidden="true">/</span>
        <a href="/playground/" class="topbar__up">Playground</a>
        <span class="topbar__sep topbar__here-sep" aria-hidden="true">/</span>
        <span class="topbar__here" aria-current="page">Text hover effect</span>
      </div>
      <div class="topbar__nav">
        <a href="/files/Roberto-Losa-CV-english-dark.pdf" download data-cv>CV ↓</a>
        <button type="button" data-topbar-theme aria-label="Switch theme">◐</button>
      </div>
    </header>
    <script>
      (function () {
        var bar = document.querySelector('[data-topbar]');
        var cv = bar.querySelector('[data-cv]');
        var os = matchMedia('(prefers-color-scheme: dark)');
        function isDark() { return bar.dataset.theme ? bar.dataset.theme === 'dark' : os.matches; }
        // the CV link downloads the light or dark PDF, matching the bar's theme
        function syncCv() { cv.href = cv.getAttribute('href').replace(/(-dark)?\.pdf$/, isDark() ? '-dark.pdf' : '.pdf'); }
        try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') bar.dataset.theme = t; } catch (e) {}
        syncCv();
        os.addEventListener('change', syncCv);
        bar.querySelector('[data-topbar-theme]').addEventListener('click', function () {
          bar.dataset.theme = isDark() ? 'light' : 'dark';
          try { localStorage.setItem('theme', bar.dataset.theme); } catch (e) {}
          syncCv();
        });
      })();
    </script>
    <div class="hero-img">
      <img src="images/hero.jpg" alt="" />
    </div>
    <div class="container">
      <div class="word">
        <span>T</span>
        <span>H</span>
        <span>E</span>
      </div>
      <div class="word">
        <span>C</span>
        <span>L</span>
        <span>E</span>
        <span>V</span>
        <span>E</span>
        <span>L</span>
        <span>A</span>
        <span>N</span>
        <span>D</span>
      </div>
      <div class="word">
        <span>M</span>
        <span>U</span>
        <span>S</span>
        <span>E</span>
        <span>U</span>
        <span>M</span>
      </div>
      <div class="word">
        <span>A</span>
        <span>R</span>
        <span>T</span>
        <span>I</span>
        <span>S</span>
        <span>T</span>
        <span>S</span>
      </div>
    </div>

    <script>
      const textContainers = document.querySelectorAll('.word')

      const defaultScale = 1
      const maxScale = 2
      const neighborScale = 1.5

      textContainers.forEach((textContainer) => {
        const spans = textContainer.querySelectorAll('span')

        textContainer.addEventListener('mousemove', (e) => {
          const target = e.target
          const index = Array.from(spans).indexOf(target)

          spans.forEach((span, i) => {
            let scale = defaultScale

            if (i === index) {
              scale = maxScale
            } else if (i === index - 1 || i === index + 1) {
              scale = neighborScale
            }

            span.style.transform = `scaleY(${scale})`
          })
        })

        textContainer.addEventListener('mouseleave', () => {
          spans.forEach((span) => {
            span.style.transform = `scaleY(${defaultScale})`
          })
        })
      })
    </script>
  </body>
</html>
