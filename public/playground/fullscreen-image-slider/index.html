<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roberto Losa - Fullcreen Image Slider</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../apple-touch-icon.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../favicon-32x32.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../favicon-16x16.png?v=1"
    />
    <link rel="manifest" href="../site.webmanifest.json?v=1" />
    <link rel="mask-icon" href="../safari-pinned-tab.svg?v=1" color="#000000" />
    <link rel="shortcut icon" href="../favicon.ico?v=1" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="../topbar.css" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
      integrity="sha512-16esztaSRplJROstbIIdwX3N97V1+pZvV33ABoG1H2OyTttBxEGkTsoIVsiP1iaTtM8b3+hu2kB6pQ4Clr5yug=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <header class="topbar" data-topbar>
      <div class="topbar__crumbs" role="navigation" aria-label="Breadcrumb">
        <a href="/">Roberto Losa</a>
        <span class="topbar__sep" aria-hidden="true">/</span>
        <a href="/playground/" class="topbar__up">Playground</a>
        <span class="topbar__sep topbar__here-sep" aria-hidden="true">/</span>
        <span class="topbar__here" aria-current="page">Fullscreen image slider</span>
      </div>
      <div class="topbar__nav">
        <a href="/files/Roberto-Losa-CV-english-dark.pdf" download data-cv>CV ↓</a>
        <button type="button" data-topbar-theme aria-label="Switch theme">◐</button>
      </div>
    </header>
    <script>
      (function () {
        var bar = document.querySelector('[data-topbar]');
        var cv = bar.querySelector('[data-cv]');
        var os = matchMedia('(prefers-color-scheme: dark)');
        function isDark() { return bar.dataset.theme ? bar.dataset.theme === 'dark' : os.matches; }
        // the CV link downloads the light or dark PDF, matching the bar's theme
        function syncCv() { cv.href = cv.getAttribute('href').replace(/(-dark)?\.pdf$/, isDark() ? '-dark.pdf' : '.pdf'); }
        try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') bar.dataset.theme = t; } catch (e) {}
        syncCv();
        os.addEventListener('change', syncCv);
        bar.querySelector('[data-topbar-theme]').addEventListener('click', function () {
          bar.dataset.theme = isDark() ? 'light' : 'dark';
          try { localStorage.setItem('theme', bar.dataset.theme); } catch (e) {}
          syncCv();
        });
      })();
    </script>

    <div class="slider-content">
      <div class="slide-number">
        <div class="prefix">
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
        </div>
        <div class="postfix"><span>/</span> 5</div>
      </div>

      <div class="slide-name">
        <div class="names">
          <div>Ether Shift Mode</div>
          <div>Solar Thread</div>
          <div>Quantum Sheen Veil</div>
          <div>Flux Aura</div>
          <div>Echo Nimbus</div>
        </div>
      </div>

      <div class="slide-year">
        <div class="years">
          <div>2023</div>
          <div>2021</div>
          <div>2022</div>
          <div>2021</div>
          <div>2023</div>
        </div>
      </div>
    </div>

    <div class="slider">
      <div class="slide" id="slide-1">
        <img src="./images/img-1.jpg" alt="" />
      </div>
      <div class="slide" id="slide-2">
        <img src="./images/img-2.jpg" alt="" />
      </div>
      <div class="slide" id="slide-3">
        <img src="./images/img-3.jpg" alt="" />
      </div>
      <div class="slide" id="slide-4">
        <img src="./images/img-4.jpg" alt="" />
      </div>
      <div class="slide" id="slide-5">
        <img src="./images/img-5.jpg" alt="" />
      </div>
      <div style="height: 400vh"></div>
    </div>

    <a href="#slide-2" class="scroll">Scroll to navigate</a>

    <script src="./script.js"></script>
  </body>
</html>
