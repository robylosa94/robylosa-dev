<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roberto Losa - 3D Image Gallery</title>
    <link rel="canonical" href="https://www.robylosa.dev/playground/3d-image-gallery/" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../apple-touch-icon.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../favicon-32x32.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../favicon-16x16.png?v=1"
    />
    <link rel="manifest" href="../site.webmanifest.json?v=1" />
    <link rel="mask-icon" href="../safari-pinned-tab.svg?v=1" color="#000000" />
    <link rel="shortcut icon" href="../favicon.ico?v=1" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="../topbar.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar" data-topbar>
      <div class="topbar__crumbs" role="navigation" aria-label="Breadcrumb">
        <a href="/">Roberto Losa</a>
        <span class="topbar__sep" aria-hidden="true">/</span>
        <a href="/playground/" class="topbar__up">Playground</a>
        <span class="topbar__sep topbar__here-sep" aria-hidden="true">/</span>
        <span class="topbar__here" aria-current="page">3D image gallery</span>
      </div>
      <div class="topbar__nav">
        <a href="/files/Roberto-Losa-CV-english-dark.pdf" download data-cv>CV ↓</a>
        <button type="button" data-topbar-theme aria-label="Switch theme">◐</button>
      </div>
    </header>
    <script>
      (function () {
        var bar = document.querySelector('[data-topbar]');
        var cv = bar.querySelector('[data-cv]');
        var os = matchMedia('(prefers-color-scheme: dark)');
        function isDark() { return bar.dataset.theme ? bar.dataset.theme === 'dark' : os.matches; }
        // the CV link downloads the light or dark PDF, matching the bar's theme
        function syncCv() { cv.href = cv.getAttribute('href').replace(/(-dark)?\.pdf$/, isDark() ? '-dark.pdf' : '.pdf'); }
        try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') bar.dataset.theme = t; } catch (e) {}
        syncCv();
        os.addEventListener('change', syncCv);
        bar.querySelector('[data-topbar-theme]').addEventListener('click', function () {
          bar.dataset.theme = isDark() ? 'light' : 'dark';
          try { localStorage.setItem('theme', bar.dataset.theme); } catch (e) {}
          syncCv();
        });
      })();
    </script>
    <div class="container">
      <div class="gallery">
        <div class="block block-1"></div>
        <div class="block block-2"></div>
        <div class="block block-3"></div>
        <div class="block block-4"></div>
        <div class="block block-5"></div>
        <div class="block block-6"></div>
        <div class="block block-7"></div>
        <div class="block block-8"></div>
        <div class="block block-9"></div>
        <div class="block block-10"></div>
        <div class="block block-11"></div>
        <div class="block block-12"></div>
        <div class="block block-13"></div>
        <div class="block block-14"></div>
        <div class="block block-15"></div>
        <div class="block block-16"></div>
        <div class="block block-17"></div>
        <div class="block block-18"></div>
        <div class="block block-19"></div>
        <div class="block block-20"></div>
        <div class="block block-21"></div>
        <div class="block block-22"></div>
        <div class="block block-23"></div>
        <div class="block block-24"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.0/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
