<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roberto Losa - Overlay Navigation Menu</title>
    <link rel="canonical" href="https://www.robylosa.dev/playground/overlay-navigation-menu/" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../apple-touch-icon.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../favicon-32x32.png?v=1"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../favicon-16x16.png?v=1"
    />
    <link rel="manifest" href="../site.webmanifest.json?v=1" />
    <link rel="mask-icon" href="../safari-pinned-tab.svg?v=1" color="#000000" />
    <link rel="shortcut icon" href="../favicon.ico?v=1" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="../topbar.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <header class="topbar" data-topbar>
      <div class="topbar__crumbs" role="navigation" aria-label="Breadcrumb">
        <a href="/">Roberto Losa</a>
        <span class="topbar__sep" aria-hidden="true">/</span>
        <a href="/playground/" class="topbar__up">Playground</a>
        <span class="topbar__sep topbar__here-sep" aria-hidden="true">/</span>
        <span class="topbar__here" aria-current="page">Overlay Navigation Menu</span>
      </div>
      <div class="topbar__nav">
        <a href="/files/Roberto-Losa-CV-english-dark.pdf" download data-cv>CV ↓</a>
        <button type="button" data-topbar-theme aria-label="Switch theme">◐</button>
      </div>
    </header>
    <script>
      (function () {
        var bar = document.querySelector('[data-topbar]');
        var cv = bar.querySelector('[data-cv]');
        var os = matchMedia('(prefers-color-scheme: dark)');
        function isDark() { return bar.dataset.theme ? bar.dataset.theme === 'dark' : os.matches; }
        // the CV link downloads the light or dark PDF, matching the bar's theme
        function syncCv() { cv.href = cv.getAttribute('href').replace(/(-dark)?\.pdf$/, isDark() ? '-dark.pdf' : '.pdf'); }
        try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') bar.dataset.theme = t; } catch (e) {}
        syncCv();
        os.addEventListener('change', syncCv);
        bar.querySelector('[data-topbar-theme]').addEventListener('click', function () {
          bar.dataset.theme = isDark() ? 'light' : 'dark';
          try { localStorage.setItem('theme', bar.dataset.theme); } catch (e) {}
          syncCv();
        });
      })();
    </script>
    <div class="container">
      <nav>
        <div class="logo">Impulse</div>
        <div class="menu-open-btn">Menu</div>
      </nav>

      <h1 class="header">Technopolymer</h1>

      <div class="menu-overlay">
        <div class="menu-nav">
          <div class="menu-logo">Impulse</div>
          <div class="menu-close-btn">Close</div>
        </div>
        <div class="menu-cols">
          <div class="col">
            <div class="video">
              <div class="video-preview"></div>
              <div class="video-details">
                <p><i class="ph-fill ph-play-circle"></i> Play reel</p>
                <p>-01:18</p>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="menu-link">
              <a href="#">Home</a>
            </div>
            <div class="menu-link">
              <a href="#">Workplace</a>
            </div>
            <div class="menu-link">
              <a href="#">Services & Models</a>
            </div>
            <div class="menu-link">
              <a href="#">Our Story</a>
            </div>
            <div class="menu-link">
              <a href="#">Contact</a>
            </div>
            <div class="btn">
              <a href="#">Take a seat</a>
            </div>
          </div>
        </div>
        <div class="menu-footer">
          <div class="menu-divider"></div>
          <div class="menu-footer-copy">
            <div class="slogan"><p>Tomorrow's Brands, Today.</p></div>
            <div class="socials">
              <a href="#">Twitter</a>
              <a href="#">Instagram</a>
              <a href="#">LinkedIn</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
